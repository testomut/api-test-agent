openapi: 3.0.3
info:
  title: Inventory Demo API
  version: 1.0.0
  description: >
    Small in-memory API used to demonstrate api-test-agent. It contains one
    deliberate contract mismatch (GET /stats) and two operations that are
    intentionally hard to test (admin auth, report without schema).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:3100
security: []
tags:
  - name: items
    description: Inventory items
  - name: ops
    description: Service operations
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      tags: [ops]
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /items:
    get:
      operationId: listItems
      summary: List items
      tags: [items]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          description: Items to skip (offset pagination).
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: tag
          in: query
          required: false
          description: Only items carrying this tag.
          schema:
            type: string
            minLength: 1
            maxLength: 30
        - name: sort
          in: query
          required: false
          description: Order of the items; a leading "-" is descending.
          schema:
            type: string
            enum: [name, -name, price, -price]
      responses:
        '200':
          description: Items page
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
                  total:
                    type: integer
                    minimum: 0
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createItem
      summary: Create an item
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
          links:
            GetItem:
              operationId: getItem
              parameters:
                itemId: '$response.body#/id'
            UpdateItem:
              operationId: updateItem
              parameters:
                itemId: '$response.body#/id'
            DeleteItem:
              operationId: deleteItem
              parameters:
                itemId: '$response.body#/id'
        '400':
          $ref: '#/components/responses/BadRequest'
  /items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getItem
      summary: Get one item
      tags: [items]
      responses:
        '200':
          description: The item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateItem
      summary: Partially update an item
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemPatch'
      responses:
        '200':
          description: Updated item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteItem
      summary: Delete an item
      tags: [items]
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /stats:
    get:
      operationId: getStats
      summary: Inventory statistics
      tags: [ops]
      responses:
        '200':
          description: Totals
          content:
            application/json:
              schema:
                type: object
                required: [total, totalValue]
                properties:
                  total:
                    type: integer
                  totalValue:
                    type: number
  /reports/{reportId}:
    get:
      operationId: getReport
      summary: Download a stored report
      tags: [ops]
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Report payload (shape not documented)
          content:
            application/json: {}
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/login:
    post:
      operationId: login
      summary: Exchange credentials for a short-lived bearer token
      tags: [ops]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum: [bearer]
                  expires_in:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    get:
      operationId: getMe
      summary: The user the token belongs to
      tags: [ops]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [username]
                properties:
                  username:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/reset:
    post:
      operationId: resetInventory
      summary: Delete all items
      tags: [ops]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Inventory cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ItemInput:
      type: object
      additionalProperties: false
      required: [name, price]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Mechanical keyboard
        price:
          type: number
          minimum: 0
          example: 89.9
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 30
          example: [hardware]
    ItemPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Mechanical keyboard v2
        price:
          type: number
          minimum: 0
          example: 99.5
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 30
    Item:
      type: object
      required: [id, name, price, tags, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: number
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
