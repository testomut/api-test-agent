name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The demo API issues 5-minute tokens: the agent and the generated suites log in themselves.
      API_LOGIN: POST /auth/login
      API_LOGIN_BODY: '{"username":"${API_USER}","password":"${API_PASSWORD}"}'
      API_USER: demo
      API_PASSWORD: demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install schemathesis
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Generated code for the synthetic fixture compiles (TypeScript and Python)
        # tests/fixtures/coverage/kitchen-sink.yaml exercises every template: nested bodies, all parameter
        # kinds, error responses, scenarios. Generated, never run (no server), but it must compile.
        run: |
          npx tsx src/cli.ts generate tests/fixtures/coverage/kitchen-sink.yaml --deps tests/fixtures/coverage/kitchen-sink.deps.json --tests-dir tests/api-ks --max-cases 500 -o reports/ks --fail-on never
          npx tsc --noEmit
          npx tsx src/cli.ts generate tests/fixtures/coverage/kitchen-sink.yaml --deps tests/fixtures/coverage/kitchen-sink.deps.json --tests-dir tests/api-ks-python --lang python --max-cases 500 -o reports/ks-python --fail-on never
          python -m py_compile $(find tests/api-ks-python -name '*.py')
          npx tsx src/cli.ts registry validate tests/api-ks/_support/cases.json --spec tests/fixtures/coverage/kitchen-sink.yaml --require-spec > /dev/null
          rm -rf tests/api-ks tests/api-ks-python

      - name: Start demo API
        run: |
          nohup npm run demo > demo-api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3100/health > /dev/null && exit 0; sleep 1; done; cat demo-api.log; exit 1

      - name: Audit (probe + Schemathesis)
        # The demo API has one deliberate defect, so a non-zero exit is expected here.
        run: npx tsx src/cli.ts audit demo-api/openapi.yaml -u http://localhost:3100 --probe --schemathesis --max-time 60 -o reports/audit --schemathesis-bin schemathesis --fail-on never

      - name: Self-check - the known defect must be reported, nothing else
        run: |
          node -e '
            const r = require("./reports/audit/report.json");
            const bad = r.operations.filter(o => [o.probe, o.schemathesis].some(f => f && f.status === "CONTRACT_MISMATCH")).map(o => o.key);
            console.log("mismatches:", bad);
            if (JSON.stringify(bad) !== JSON.stringify(["GET /stats"])) process.exit(1);
          '

      - name: Generate tests (resource/method/functional|contract|scenarios) and run them once
        run: npx tsx src/cli.ts generate demo-api/openapi.yaml -u http://localhost:3100 --allow-write --run -o reports/generate --fail-on never

      - name: Self-check - generated suite fails only on the known defect
        run: |
          node -e '
            const r = require("./reports/generate/report.json");
            const bad = r.generated.scenarios.filter(s => s.status === "CONTRACT_MISMATCH" || s.status === "TEST_FAILURE").map(s => s.name);
            const passed = r.generated.scenarios.filter(s => s.status === "PASS").length;
            console.log("failing:", bad, "passed:", passed);
            if (JSON.stringify(bad) !== JSON.stringify(["stats/get/contract"]) || passed < 10) process.exit(1);
          '

      - name: Self-check - every physical test has its own registered case ID; registry and manifest are valid
        run: |
          node -e '
            const c = require("./reports/generate/report.json").generated.caseIdCheck;
            console.log(JSON.stringify(c));
            if (!c || c.tests < 10 || c.missing.length || c.duplicates.length || c.unregistered.length) process.exit(1);
          '
          npx tsx src/cli.ts registry validate tests/api/_support/cases.json --spec demo-api/openapi.yaml --require-spec > /dev/null
          npx tsx src/cli.ts manifest validate --tests-dir tests/api

      - name: Generate Python tests (pytest + requests) and run them once
        run: |
          pip install pytest requests jsonschema
          npx tsx src/cli.ts generate demo-api/openapi.yaml -u http://localhost:3100 --allow-write --run --lang python --tests-dir tests/api-python -o reports/generate-python --fail-on never
          node -e '
            const r = require("./reports/generate-python/report.json");
            const bad = r.generated.scenarios.filter(s => s.status === "CONTRACT_MISMATCH" || s.status === "TEST_FAILURE").map(s => s.name);
            const passed = r.generated.scenarios.filter(s => s.status === "PASS").length;
            console.log("failing:", bad, "passed:", passed);
            if (JSON.stringify(bad) !== JSON.stringify(["stats/get/contract"]) || passed < 10) process.exit(1);
            const c = r.generated.caseIdCheck;
            console.log(JSON.stringify(c));
            if (!c || c.tests < 10 || c.missing.length || c.duplicates.length || c.unregistered.length) process.exit(1);
            // TypeScript and Python generate the same active cases (retired ones are history).
            const active = (f) => Object.entries(require(f).cases).filter(([, c]) => c.status !== "retired").map(([id]) => id).sort();
            const ts = active("./tests/api/_support/cases.json");
            const py = active("./tests/api-python/_support/cases.json");
            if (JSON.stringify(ts) !== JSON.stringify(py)) { console.log("TS/Python case sets differ"); process.exit(1); }
          '
          npx tsx src/cli.ts registry validate tests/api-python/_support/cases.json --spec demo-api/openapi.yaml --require-spec > /dev/null
          npx tsx src/cli.ts manifest validate --tests-dir tests/api-python

      - name: Analyse the legacy example project (init + run)
        working-directory: examples/legacy-project
        run: |
          node ../../dist/cli.js init --yes --base-url http://localhost:3100 --spec ../../demo-api/openapi.yaml --postman postman/inventory.postman_collection.json
          node ../../dist/cli.js run --no-schemathesis
          node ../../dist/cli.js adapt --dry-run | tee adapt-plan.txt
          grep -q "positive.items-lifecycle.spec.ts" adapt-plan.txt
          grep -q "shared state" adapt-plan.txt
          node -e '
            const r = require("./reports/api-agent/report.json");
            const a = r.analysis;
            const ok = a.tests.length === 7 && a.notInSpec.includes("GET /version") && a.edges.some(e => e.source === "existing-tests") && a.edges.some(e => e.source === "postman");
            console.log("tests:", a.tests.length, "edges:", a.edges.length, "notInSpec:", a.notInSpec);
            if (!ok) process.exit(1);
          '

      - name: Analyse the legacy pytest project (init + run)
        working-directory: examples/legacy-pytest-project
        run: |
          node ../../dist/cli.js init --yes --base-url http://localhost:3100 --spec ../../demo-api/openapi.yaml --lang python
          node ../../dist/cli.js run --no-schemathesis
          node ../../dist/cli.js adapt --dry-run | tee adapt-plan.txt
          grep -q "test_positive_item_lifecycle.py" adapt-plan.txt
          node -e '
            const r = require("./reports/api-agent/report.json");
            const a = r.analysis;
            const ok = a.tests.length === 6 && a.edges.some(e => e.source === "existing-tests" && e.to === "PATCH /items/{itemId}") && a.testIssues.some(i => i.code === "order-dependent");
            console.log("tests:", a.tests.length, "edges:", a.edges.length, "issues:", a.testIssues.length);
            if (!ok) process.exit(1);
          '

      - name: Job summary
        if: always()
        run: cat reports/audit/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            reports/
            playwright-report/
            examples/legacy-project/reports/
            examples/legacy-pytest-project/reports/
